run_id: videola_qwen35_adapter_demo_sim_pick_place
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: videola
is_debug: false

framework:
  name: Qwen35Adapter
  qwen35:
    base_vlm: Qwen/Qwen3.5-4B
    attn_implementation: sdpa
    trust_remote_code: false
    vl_hidden_dim: 2560
    lora:
      enabled: true
      rank: 64
      alpha: 128
      dropout: 0.0
      target_modules: all-linear
      init_lora_weights: gaussian
  action_model:
    action_model_type: VLA-Adapter
    hidden_dim: 1024
    action_dim: 8
    state_dim: 8
    action_query_num: 64
    use_pro_version: true
    use_proprio: true
    phase: Training
    num_actions_chunk: 16
    future_action_window_size: 15
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/demo_data
    data_mix: demo_sim_pick_place
    action_mode: abs
    include_state: true
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs: ["base_view", "ego_view"]
    image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 100
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: "qwen_vl_interface"
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
